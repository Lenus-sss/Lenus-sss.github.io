<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profiles · Lenus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../section.css?v=20260830-2">
</head>
<body class="profiles-body" data-title-en="Profiles · Lenus" data-title-zh="账号 · Lenus">
  <main class="profiles-page">
    <div class="profiles-title-wrap">
      <h1 data-en="Profiles" data-zh="账号">Profiles</h1>
      <button class="language-toggle-leaf" type="button" data-language-toggle aria-label="Switch to Chinese">🍃</button>
    </div>

    <nav class="profile-links" aria-label="Profiles">
      <a class="profile-link" href="https://github.com/Lenus-sss" aria-label="GitHub">
        <img src="../assets/icons/github.svg" alt="">
      </a>
      <a class="profile-link" href="https://leetcode.cn/u/practical-meitneryzt/" aria-label="LeetCode">
        <img src="../assets/icons/leetcode.svg" alt="">
      </a>
      <a class="profile-link" href="https://space.bilibili.com/3690971283851292" aria-label="哔哩哔哩">
        <img src="../assets/icons/bilibili.svg" alt="">
      </a>
      <a class="profile-link" href="https://www.zhihu.com/people/39-20-44-10" aria-label="知乎">
        <img src="../assets/icons/zhihu.svg" alt="">
      </a>
      <a
        class="profile-link profile-email"
        href="mailto:1391604748@qq.com"
        data-copy-email="1391604748@qq.com"
        aria-label="Copy email address"
      >
        <img src="../assets/icons/email.svg" alt="">
      </a>
    </nav>
  </main>

  <div class="copy-toast" data-copy-toast role="status" aria-live="polite" aria-atomic="true">
    <span class="copy-toast-check" aria-hidden="true">✓</span>
    <span data-copy-message data-en="Copied" data-zh="已复制">Copied</span>
  </div>

  <script src="../section-language.js"></script>
  <script>
    const emailButton = document.querySelector("[data-copy-email]");
    const copyToast = document.querySelector("[data-copy-toast]");
    const copyMessage = document.querySelector("[data-copy-message]");
    let copyToastTimer;

    // 点击后只让自定义提示淡入淡出，不调用浏览器默认弹窗打断页面体验。
    function showCopyToast(messageEn, messageZh) {
      copyMessage.dataset.en = messageEn;
      copyMessage.dataset.zh = messageZh;
      copyMessage.textContent = document.documentElement.lang === "zh-CN" ? messageZh : messageEn;
      copyToast.classList.add("is-visible");
      clearTimeout(copyToastTimer);
      copyToastTimer = setTimeout(() => copyToast.classList.remove("is-visible"), 1800);
    }

    emailButton.addEventListener("click", async (event) => {
      event.preventDefault();
      try {
        await navigator.clipboard.writeText(emailButton.dataset.copyEmail);
        showCopyToast("Copied", "已复制");
      } catch {
        showCopyToast("Copy failed", "复制失败");
      }
    });
  </script>
  <script src="../disable-copy.js"></script>
</body>
</html>
