<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Lenus</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;1,300;1,400&display=swap"
    rel="stylesheet"
  >

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      font-family: "Inter", sans-serif;
      color: #ffffff;

      /* 默认使用横屏图；宽高比不超过 1:1 时由媒体查询切换为竖屏图。 */
      background: #000000 url("./BG_PC.png") center / contain no-repeat;
    }

    .page {
      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      position: relative;
      overflow: hidden;

      padding: 40px 20px;
    }

    .content {
      text-align: center;
      transform: translateY(-15px);
    }

    .name {
      font-size: clamp(58px, 8vw, 88px);

      font-weight: 300;
      font-style: italic;
      line-height: 1;

      letter-spacing: -2px;

      margin-bottom: 16px;
      color: #ffffff;
    }

    .subtitle {
      font-size: clamp(18px, 2.4vw, 24px);

      font-weight: 300;

      letter-spacing: -0.4px;

      margin-bottom: 34px;
      color: #ffffff;
    }

    .navigation {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .navigation a {
      min-width: 110px;
      padding: 9px 18px;
      border: 1px solid rgba(255, 255, 255, 0.88);

      color: #ffffff;

      text-decoration: none;

      font-size: 15px;
      font-weight: 400;

      letter-spacing: 0.2px;

      background: transparent;

      transition:
        background 0.2s ease,
        transform 0.2s ease;
    }

    .navigation a:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.14);
      transform: translateY(-2px);
    }

    .navigation a:focus-visible {
      outline: 2px solid #ffffff;
      outline-offset: 3px;
    }

    .dot {
      position: absolute;

      width: 4px;
      height: 4px;

      border-radius: 50%;
      background: rgba(255, 255, 255, 0.34);
    }

    .dot-one {
      top: 1%;
      left: 18%;
    }

    .dot-two {
      left: 19%;
      bottom: 20%;
    }

    .dot-three {
      right: 21%;
      bottom: 17%;
    }

    @media (max-aspect-ratio: 1 / 1) {
      body {
        background-image: url("./BG_Phone.png");
      }
    }

    @media (max-width: 600px) {
      .content {
        transform: translateY(-5px);
      }

      .subtitle {
        margin-bottom: 28px;
      }

      .navigation {
        max-width: 280px;
        margin: 0 auto;
      }

      .navigation a {
        min-width: 125px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <span class="dot dot-one"></span>
    <span class="dot dot-two"></span>
    <span class="dot dot-three"></span>

    <section class="content">

      <h1 class="name">Lenus</h1>

      <p class="subtitle">
        Game Client Engineer
      </p>

      <nav class="navigation">

        <a href="#">
          Experience
        </a>

        <a href="#">
          Profiles
        </a>

        <a href="#">
          Research
        </a>

        <a href="#">
          Thoughts
        </a>

      </nav>

    </section>

  </main>

</body>
</html>
