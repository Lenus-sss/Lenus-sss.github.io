<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Lenus</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;1,300;1,400&display=swap"
    rel="stylesheet"
  >

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      font-family: "Times New Roman", "FangSong", "仿宋", "STFangsong", serif;
      color: #ffffff;

      background: #000000 url("./BG_PC.png") center / contain no-repeat;
    }

    .page {
      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      position: relative;
      overflow: hidden;

      padding: 40px 20px;
    }

    .content {
      text-align: center;
      transform: translateY(-15px);
    }

    .language-toggle {
      position: absolute;
      z-index: 1;
      top: -0.28em;
      left: calc(100% + 0.3em);

      padding: 0.12em;
      border: 0;

      background: transparent;

      font: inherit;
      font-size: clamp(20px, 1.45vw, 56px);
      line-height: 1;
      cursor: pointer;

      transition:
        opacity 0.2s ease,
        transform 0.2s ease;
    }

    .language-toggle:hover {
      opacity: 0.86;
      transform: scale(1.1);
    }

    .language-toggle:focus-visible {
      outline: 2px solid #ffffff;
      outline-offset: 2px;
      border-radius: 50%;
    }

    .name-wrap {
      position: relative;
      display: table;
      margin: 0 auto clamp(16px, 0.8vw, 30px);
    }

    /* 品牌名固定使用原来的 Inter，避免跟随正文语言切换字体。 */
    .name {
      font-size: clamp(58px, 4.6vw, 176px);

      font-family: "Inter", sans-serif;
      font-weight: 300;
      font-style: italic;
      line-height: 1;

      letter-spacing: -2px;

      color: #ffffff;
    }

    .subtitle {
      font-size: clamp(18px, 1.25vw, 48px);

      font-weight: 300;

      letter-spacing: -0.4px;

      margin-bottom: clamp(34px, 2.2vw, 84px);
      color: #ffffff;
    }

    .navigation {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: clamp(12px, 0.75vw, 28px);
    }

    .navigation a {
      min-width: clamp(110px, 6.5vw, 250px);
      padding:
        clamp(9px, 0.55vw, 21px)
        clamp(18px, 1vw, 38px);
      border: 1px solid rgba(255, 255, 255, 0.88);
      border-radius: clamp(12px, 0.8vw, 24px);

      color: #ffffff;

      text-decoration: none;

      font-size: clamp(15px, 0.8vw, 31px);
      font-weight: 400;

      letter-spacing: 0.2px;

      background: transparent;

      transition:
        background 0.2s ease,
        transform 0.2s ease;
    }

    .navigation a:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.14);
      transform: translateY(-2px);
    }

    .navigation a:focus-visible {
      outline: 2px solid #ffffff;
      outline-offset: 3px;
    }

    .dot {
      position: absolute;

      width: 4px;
      height: 4px;

      border-radius: 50%;
      background: rgba(255, 255, 255, 0.34);
    }

    .dot-one {
      top: 1%;
      left: 18%;
    }

    .dot-two {
      left: 19%;
      bottom: 20%;
    }

    .dot-three {
      right: 21%;
      bottom: 17%;
    }

    @media (max-aspect-ratio: 1 / 1) {
      body {
        background-image: url("./BG_Phone.png");
      }
    }

    @media (max-width: 600px) {
      .content {
        transform: translateY(-5px);
      }

      .subtitle {
        margin-bottom: 28px;
      }

      .navigation {
        max-width: 280px;
        margin: 0 auto;
      }

      .navigation a {
        min-width: 125px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <span class="dot dot-one"></span>
    <span class="dot dot-two"></span>
    <span class="dot dot-three"></span>

    <section class="content">

      <div class="name-wrap">
        <h1 class="name">Lenus</h1>
        <button class="language-toggle" type="button" aria-label="Switch to Chinese">🍃</button>
      </div>

      <p class="subtitle" data-i18n="role">
        Game Client Engineer
      </p>

      <nav class="navigation">

        <a href="./experience/" data-i18n="experience">
          Experience
        </a>

        <a href="./profiles/" data-i18n="profiles">
          Profiles
        </a>

        <a href="./research/" data-i18n="research">
          Research
        </a>

        <a href="./thoughts/" data-i18n="thoughts">
          Thoughts
        </a>

      </nav>

    </section>

  </main>

  <script>
    // 翻译表是页面文字的唯一来源，切换语言时同时更新按钮提示和页面语言属性。
    const translations = {
      en: {
        role: "Game Client Engineer",
        experience: "Experience",
        profiles: "Profiles",
        research: "Research",
        thoughts: "Thoughts",
        toggle: "🍃",
        toggleLabel: "Switch to Chinese"
      },
      zh: {
        role: "游戏客户端工程师",
        experience: "经历",
        profiles: "账号",
        research: "研究",
        thoughts: "思绪",
        toggle: "🍃",
        toggleLabel: "切换为英文"
      }
    };

    const languageToggle = document.querySelector(".language-toggle");
    const translatableElements = document.querySelectorAll("[data-i18n]");

    function applyLanguage(language) {
      const translation = translations[language];

      document.documentElement.lang = language === "zh" ? "zh-CN" : "en";
      translatableElements.forEach((element) => {
        element.textContent = translation[element.dataset.i18n];
      });

      languageToggle.textContent = translation.toggle;
      languageToggle.setAttribute("aria-label", translation.toggleLabel);
      localStorage.setItem("lenus-language", language);
    }

    let currentLanguage = localStorage.getItem("lenus-language") === "zh" ? "zh" : "en";
    applyLanguage(currentLanguage);

    languageToggle.addEventListener("click", () => {
      currentLanguage = currentLanguage === "en" ? "zh" : "en";
      applyLanguage(currentLanguage);
    });
  </script>

</body>
</html>
